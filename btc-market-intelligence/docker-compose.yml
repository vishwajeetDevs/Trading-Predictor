services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: btc
      POSTGRES_DB: btc_intelligence
    ports:
      - "5432:5432"
    volumes:
      - btc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc -d btc_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  btc_pg:
